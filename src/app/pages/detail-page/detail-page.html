<div class="container">
    <div class="border-2 bg-white rounded-5">
        <div class="row p-5">
            <div class="col-12 col-md-6 w-25">

                <img class="w-100" src="https://placehold.co/600x800" alt="">
            </div>
            <div class="col-12 col-md-6">
                @for (anime of animes(); track anime.id) {
                    <div class="position-relative">                    
                            <h1>{{ anime.title }}</h1>                    
                            <p>{{ anime.synopsis }}</p>
                            <p>Age: {{ anime.ageRating }}</p>
                        <div class="position-absolute top-0 end-0">
                            <p class="">{{anime.year}}</p>
                            <p>{{anime.genres}}</p>
                            <br>
                            <p>{{anime.moods}}</p>
                            <br>
                            <p>{{anime.platforms}}</p>
                        </div>
                    </div>
                    }
                
            </div>
        </div>
    </div>
</div>
